<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02030a">
  <title>A Heart Made of Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene">
    <div id="stars"></div>

    <div id="heart" aria-label="A heart made of I Love You words"></div>

    <div class="center-message" id="message">
      <h1>I Love You</h1>
      <p>FOREVER &amp; ALWAYS ♡</p>
    </div>

    <div class="controls">
      <button id="replay" type="button">Draw the heart again ↻</button>
      <div class="caption">MADE WITH LOVE</div>
    </div>
  </main>
</body>
</html>
